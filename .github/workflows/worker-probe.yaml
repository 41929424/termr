# A small, fast gate that must be green before the full R-CMD-check matrix is
# worth running: the worker bootstrap probes on all three platforms (plain
# installed package, and inside R CMD check where R_TESTS is exported), plus
# the Unix PTY harness. Minutes, not an hour.
#
# Runs on demand and on pushes to ci-probe/** branches only.
on:
  workflow_dispatch:
  push:
    branches: ['ci-probe/**']

name: worker-probe

permissions: read-all

jobs:
  workers:
    runs-on: ${{ matrix.os }}
    name: worker probe (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::rcmdcheck
          needs: check

      - name: Probe - installed package, plain Rscript
        id: plain
        shell: bash
        env:
          NOT_CRAN: true
        run: Rscript tools/ci/plain-probe.R 2>&1 | tee plain-probe.log

      - name: Probe - inside R CMD check (R_TESTS exported by check)
        id: check
        if: always()
        shell: bash
        env:
          NOT_CRAN: true
          TERMR_TEST_FILTER: worker-bootstrap
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD build --no-manual --no-build-vignettes .
          R CMD check --no-manual --no-examples --no-build-vignettes --ignore-vignettes \
            --no-codetools termr_*.tar.gz

      - name: Report probe output
        if: ${{ always() && (steps.plain.outcome == 'failure' || steps.check.outcome == 'failure') }}
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          $PY tools/ci/annotate.py "plain worker probe (${{ matrix.os }})" plain-probe.log || true
          $PY tools/ci/annotate.py "worker probe tests (${{ matrix.os }})" termr.Rcheck/tests/testthat.Rout.fail || true
          $PY tools/ci/annotate.py "worker probe 00check.log (${{ matrix.os }})" termr.Rcheck/00check.log 3000 || true

  pty:
    runs-on: ${{ matrix.os }}
    name: PTY (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Run PTY checks
        env:
          PYTHONUTF8: 1
          TERM: xterm-256color
        run: |
          Rscript tools/pty/test-fixture.R
          python3 tools/pty/pty-check-ci.py
