on:
  push:
    branches: [main, master, 'develop-*']
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          # The minimum declared in DESCRIPTION (Depends: R >= 4.1.0).
          - {os: ubuntu-latest, r: '4.1'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'

      - name: Run extended regression suite
        env:
          NOT_CRAN: true
        run: Rscript -e "testthat::test_local(reporter = 'summary')"

  SQL-integration:
    runs-on: ubuntu-latest
    name: SQL integration (DBI + SQLite)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::DBI
            any::RSQLite
          needs: check
      - name: Verify optional database dependencies and run integration tests
        run: >-
          Rscript -e "stopifnot(requireNamespace('DBI', quietly = TRUE),
          requireNamespace('RSQLite', quietly = TRUE));
          testthat::test_local(filter = 'sql|datatable-source|database-explorer', reporter = 'summary')"

  pty:
    # Drives the Unix terminal driver in a real pseudo terminal.
    runs-on: ${{ matrix.os }}
    name: PTY integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Run PTY checks
        env:
          PYTHONUTF8: 1
          TERM: xterm-256color
        run: |
          Rscript tools/pty/test-fixture.R
          python3 tools/pty/pty-check-ci.py

  windows-input:
    # WindowsDriver's wire parser and the shared input/event behavior are
    # deterministic without an interactive desktop console.
    runs-on: windows-latest
    name: Windows input regressions
    env:
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Parse the PowerShell console helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/inst/helpers/termr-input.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Run Windows input and boundary tests
        run: >-
          Rscript -e "testthat::test_local(
          filter = 'windows-driver|mouse|paste|graphemes|unicode|platform-bounds|lifecycle',
          reporter = 'summary')"

      - name: Check the PTY event fixture headlessly
        run: Rscript tools/pty/test-fixture.R
