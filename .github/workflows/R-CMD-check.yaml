on:
  push:
    branches: [main, master, develop-0.2, develop-0.3, develop-0.4, develop-0.5, develop-0.6, develop-0.7]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'

      - name: Run extended regression suite
        if: runner.os == 'Windows'
        env:
          NOT_CRAN: true
        run: Rscript -e "testthat::test_local(reporter = 'summary')"

  SQL-integration:
    runs-on: ubuntu-latest
    name: SQL integration (DBI + SQLite)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::DBI
            any::RSQLite
          needs: check
      - name: Verify optional database dependencies and run integration tests
        run: >-
          Rscript -e "stopifnot(requireNamespace('DBI', quietly = TRUE),
          requireNamespace('RSQLite', quietly = TRUE));
          testthat::test_local(filter = 'sql|datatable-source|database-explorer', reporter = 'summary')"

  pty:
    # Drives the Unix terminal driver in a real pseudo terminal.
    runs-on: ${{ matrix.os }}
    name: PTY integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Run PTY checks
        run: python3 tools/pty/pty-check-ci.py
